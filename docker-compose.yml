services:
  postgres:
    image: postgres:16
    ports:
      # Story 33.5: host port is overridable via env to avoid collisions
      # with another Postgres instance on the contributor's machine. The
      # container port stays fixed at 5432.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: mindshed
      POSTGRES_PASSWORD: mindshed
      POSTGRES_DB: mindshed
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  minio:
    image: minio/minio:latest
    ports:
      # Story 33.5: host ports overridable via env (API + console).
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: mindshed
      MINIO_ROOT_PASSWORD: mindshed123
      MINIO_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3001
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: /init-minio.sh
    volumes:
      - ./docker/init-minio.sh:/init-minio.sh:ro

volumes:
  postgres_data:
  minio_data:
